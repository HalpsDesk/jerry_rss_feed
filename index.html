<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jerry Kendrick RSS Feed Viewer</title>
<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    margin: 0;
}
.item {
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid #ccc;
}
.item h3 {
    margin: 0 0 6px 0;
    font-size: 18px;
}
.item a {
    color: #0066cc;
    text-decoration: none;
}
.item a:hover {
    text-decoration: underline;
}
.item p {
    margin: 0;
    color: #444;
}
</style>
</head>
<body>

<h2>Jerry Kendrick – Recent Posts</h2>
<div id="rss"></div>

<script>
async function loadFeed() {
    const api = "https://jerry-rss-feed.jthalpenny.workers.dev/";
    const container = document.getElementById("rss");

    try {
        const res = await fetch(api);
        const text = await res.text();

        // Just show the raw response inside a <pre> so it's readable
        const pre = document.createElement("pre");
        pre.style.whiteSpace = "pre-wrap";
        pre.textContent = text;
        container.appendChild(pre);

    } catch (err) {
        container.textContent = "Unable to load feed.";
    }
}

loadFeed();
</script>


</body>
</html>
