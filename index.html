<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jerry Kendrick RSS Feed Viewer</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    margin: 0;
}
.item {
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid #ccc;
}
.item h3 {
    margin: 0 0 6px 0;
    font-size: 18px;
}
.item a {
    color: #0066cc;
    text-decoration: none;
}
.item a:hover {
    text-decoration: underline;
}
.item p {
    margin: 0;
    color: #444;
}
</style>

</head>
<body>

<h2>Jerry Kendrick – Recent Posts</h2>
<div id="rss"></div>

<script>
async function loadFeed() {
    const feedURL = "https://jerrykendrick.com/feed/";

    // Free public CORS passthrough
    const api = "https://api.allorigins.win/get?url=" + encodeURIComponent(feedURL);

    try {
        const res = await fetch(api);
        const data = await res.json();

        const parser = new DOMParser();
        const xml = parser.parseFromString(data.contents, "application/xml");

        const items = xml.querySelectorAll("item");
        const container = document.getElementById("rss");

        items.forEach(i => {
            const title = i.querySelector("title")?.textContent || "";
            const link = i.querySelector("link")?.textContent || "#";
            const description = i.querySelector("description")?.textContent || "";

            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
                <h3><a href="${link}" target="_blank">${title}</a></h3>
                <p>${description}</p>
            `;

            container.appendChild(div);
        });
    } catch (err) {
        document.getElementById("rss").innerHTML = "Unable to load RSS feed.";
    }
}

loadFeed();
</script>

</body>
</html>
