<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jerry Kendrick RSS Feed Viewer</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    margin: 0;
}
.item {
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid #ccc;
}
.item h3 {
    margin: 0 0 6px 0;
    font-size: 18px;
}
.item a {
    color: #0066cc;
    text-decoration: none;
}
.item a:hover {
    text-decoration: underline;
}
.item p {
    margin: 0;
    color: #444;
}
</style>

</head>
<body>

<h2>Jerry's Jams & Notions</h2>
<div id="rss"></div>

<script>
async function loadFeed() {
    const feedURL = "https://jerrykendrick.com/feed/";

    const api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feedURL);

    try {
        const res = await fetch(api);
        const data = await res.json();

        if (!data.items) {
            document.getElementById("rss").innerHTML = "Feed could not be parsed.";
            return;
        }

        const container = document.getElementById("rss");

        data.items.forEach(item => {
            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
                <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
                <p>${item.description}</p>
            `;
            container.appendChild(div);
        });

    } catch (err) {
        document.getElementById("rss").innerHTML = "Unable to load RSS feed.";
    }
}

loadFeed();
</script>


</body>
</html>
