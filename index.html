<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jerry Kendrick RSS Feed Viewer</title>
<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    margin: 0;
}
.item {
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid #ccc;
}
.item h3 {
    margin: 0 0 6px 0;
    font-size: 18px;
}
.item a {
    color: #0066cc;
    text-decoration: none;
}
.item a:hover {
    text-decoration: underline;
}
.item p {
    margin: 0;
    color: #444;
}
</style>
</head>
<body>

<h2>Jerry Kendrick – Recent Posts</h2>
<div id="rss"></div>

<script>
async function loadFeed() {
    const api = "https://jerry-rss-feed.jthalpenny.workers.dev/";

    try {
        const res = await fetch(api);
        const data = await res.json();

        const container = document.getElementById("rss");

        if (!Array.isArray(data) || data.length === 0) {
            container.textContent = "No posts found.";
            return;
        }

        data.forEach(post => {
            const title = (post.title && post.title.rendered) || "";
            const link = post.link || "#";
            // Excerpt is HTML; strip tags for a plain-text preview
            let excerptHtml = (post.excerpt && post.excerpt.rendered) || "";
            let excerpt = excerptHtml
                .replace(/<[^>]+>/g, "")   // strip HTML tags
                .replace(/\s+/g, " ")      // collapse whitespace
                .trim();

            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
                <h3><a href="${link}" target="_blank" rel="noopener noreferrer">${title}</a></h3>
                <p>${excerpt}</p>
            `;
            container.appendChild(div);
        });

    } catch (err) {
        document.getElementById("rss").textContent =
            "Unable to load posts.";
    }
}

loadFeed();
</script>

</body>
</html>
